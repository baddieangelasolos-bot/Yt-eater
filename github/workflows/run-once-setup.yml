name: Run‑once setup & initial pipeline run

on:
  workflow_dispatch:
    inputs:
      reference_channel_url:
        description: "YouTube channel URL for style/reference"
        required: true
      source_channels:
        description: "Comma‑separated list of source channel URLs"
        required: true
      clip_duration:
        description: "Length of each clip in seconds"
        required: true
        default: "15"
      fps:
        description: "Target frame rate"
        required: true
        default: "30"
      output_resolution:
        description: "Output resolution"
        required: true
        default: "1920x1080"

jobs:
  setup-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DEFAULT_CHANNEL_URL: ${{ secrets.DEFAULT_CHANNEL_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create folder structure
        run: |
          mkdir -p scripts config data clips output

      - name: Write channel configuration
        run: |
          cat > config/channel_config.json <<EOF
          {
            "reference_channel_url": "${{ github.event.inputs.reference_channel_url }}",
            "source_channels": "${{ github.event.inputs.source_channels }}",
            "clip_duration": ${{ github.event.inputs.clip_duration }},
            "fps": ${{ github.event.inputs.fps }},
            "output_resolution": "${{ github.event.inputs.output_resolution }}"
          }
          EOF

      - name: Write Python scripts
        run: |
          # fetch_channel_videos.py
          cat > scripts/fetch_channel_videos.py <<'PY'
          #!/usr/bin/env python3
          import os, json
          def main():
              cfg = json.load(open('config/channel_config.json'))
              print("Would fetch videos from", cfg['reference_channel_url'])
          if __name__ == '__main__':
              main()
          PY

          # download_clips.py
          cat > scripts/download_clips.py <<'PY'
          #!/usr/bin/env python3
          import os, json
          def main():
              cfg = json.load(open('config/channel_config.json'))
              print("Would download clips from", cfg['source_channels'])
          if __name__ == '__main__':
              main()
          PY

          # analyze_channel_style.py
          cat > scripts/analyze_channel_style.py <<'PY'
          #!/usr/bin/env python3
          import os, json
          def main():
              cfg = json.load(open('config/channel_config.json'))
              print("Would analyze style from", cfg['reference_channel_url'])
          if __name__ == '__main__':
              main()
          PY

          # generate_edit_list.py
          cat > scripts/generate_edit_list.py <<'PY'
          #!/usr/bin/env python3
          import os, json
          def main():
              cfg = json.load(open('config/channel_config.json'))
              print("Would generate edit list using", cfg['clip_duration'], "seconds per clip")
          if __name__ == '__main__':
              main()
          PY

          # render_final_video.py
          cat > scripts/render_final_video.py <<'PY'
          #!/usr/bin/env python3
          import os, json, subprocess
          def main():
              cfg = json.load(open('config/channel_config.json'))
              print("Would render video with resolution", cfg['output_resolution'])
          if __name__ == '__main__':
              main()
          PY

      - name: Make scripts executable
        run: chmod +x scripts/*.py

      - name: Install OS tools & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run dummy pipeline
        run: |
          echo "Running dummy pipeline ..."
          python scripts/fetch_channel_videos.py
          python scripts/download_clips.py
          python scripts/analyze_channel_style.py
          python scripts/generate_edit_list.py
          python scripts/render_final_video.py
          echo "Pipeline finished"

      - name: Commit files
        run: |
          git config user.name "Video Bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "🛠️ Run‑once setup: created folder structure, config and stub scripts" || echo "No changes to commit"
          git push

      - name: Finish
        run: echo "✅ Setup complete"
        
